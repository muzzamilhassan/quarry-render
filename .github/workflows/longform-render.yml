# Renders ONE 10+ min documentary per channel. Public repo = unlimited free
# minutes. No tokens here: the private automation repo downloads artifacts
# and handles YouTube uploads.
name: Long-form Render

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "script minutes (10 = real)"
        required: false
        default: "10"
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: write

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        channel: [investors-compass, money-rulebook, debt-free-doctrine, quotequarry]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: explainer/package-lock.json

      - name: Install Remotion system libraries + ffmpeg (Ubuntu 24.04)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 \
            libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 \
            libgbm-dev libcups2 libcairo2 libpango-1.0-0 libatk-bridge2.0-0 \
            ffmpeg

      - name: Install Edge-TTS
        run: python3 -m pip install --quiet --user edge-tts

      - name: Install node dependencies
        working-directory: explainer
        run: npm ci

      - name: Render documentary
        working-directory: longvideo
        env:
          LF_MINUTES: ${{ github.event_name == 'schedule' && '10' || inputs.minutes }}
          LONGVIDEO_GEMINI_API_KEY: ${{ secrets.LONGVIDEO_GEMINI_API_KEY }}
          LONGVIDEO_GROQ_API_KEY: ${{ secrets.LONGVIDEO_GROQ_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node make-longform.mjs --channel ${{ matrix.channel }}

      - name: Save topic history
        run: |
          if [ -f state/longform-${{ matrix.channel }}.json ]; then
            git config user.name "render-bot"
            git config user.email "bot@users.noreply.github.com"
            git add state/longform-${{ matrix.channel }}.json
            git commit -m "topics ${{ matrix.channel }} [skip ci]" || true
            git push origin HEAD:main || (git pull --rebase -q origin main && git push origin HEAD:main) || true
          fi

      - name: Upload render artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lf-${{ matrix.channel }}
          path: |
            explainer/out/lf-${{ matrix.channel }}.mp4
            explainer/out/lf-thumb-${{ matrix.channel }}.jpg
            explainer/out/lf-srt-${{ matrix.channel }}.srt
            explainer/out/lf-meta-${{ matrix.channel }}.json
          retention-days: 14
          if-no-files-found: error
