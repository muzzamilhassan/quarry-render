# Uploads rendered documentaries to YouTube — runs in THIS PUBLIC repo so it
# never consumes private-repo Actions minutes (public = unlimited free).
# Secrets here hold the YouTube tokens; fork PRs never receive secrets.
name: Long-form Upload

on:
  workflow_dispatch:
    inputs:
      channel:
        description: "one channel only (blank = all 4)"
        required: false
        default: ""
  schedule:
    - cron: "30 20 * * *"

permissions:
  contents: write
  actions: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install googleapis + Pillow
        run: |
          npm install googleapis
          python3 -m pip install --quiet pillow || sudo apt-get install -y -qq python3-pil

      - name: Generate thumbnails + schedule uploads
        env:
          GH_TOKEN: ${{ github.token }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YT_TOKEN_INVESTORS_COMPASS: ${{ secrets.YT_TOKEN_INVESTORS_COMPASS }}
          YT_TOKEN_MONEY_RULEBOOK: ${{ secrets.YT_TOKEN_MONEY_RULEBOOK }}
          YT_TOKEN_DEBT_FREE_DOCTRINE: ${{ secrets.YT_TOKEN_DEBT_FREE_DOCTRINE }}
          YT_TOKEN_QUOTEQUARRY: ${{ secrets.YT_TOKEN_QUOTEQUARRY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node longvideo/longform-upload.mjs ${{ inputs.channel != '' && format('--channel {0}', inputs.channel) || '' }}

      - name: Save upload history
        run: |
          if [ -f state/longform-uploads.json ]; then
            git config user.name "longform-bot"
            git config user.email "bot@users.noreply.github.com"
            git add state/longform-uploads.json
            git commit -m "longform uploads [skip ci]" || true
            git pull --rebase -q origin main || true
            git push origin HEAD:main || true
          fi
