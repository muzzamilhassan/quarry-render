# Tech Video: "Dark Mode Minimalist Tech" explainer, driven by a TOPIC you type.
# AI fits the topic into scene templates -> TTS -> clean tech music -> 1080p render.
# Render ONLY (no upload). The mp4 arrives as this run's artifact.
name: Tech Video

on:
  workflow_dispatch:
    inputs:
      topic:
        description: "Topic, e.g. How Git actually works"
        required: true
      voice:
        description: "Edge-TTS voice (blank = en-US-AndrewNeural)"
        required: false
        default: ""
      minutes:
        description: "target minutes (10 = full long-form)"
        required: false
        default: "10"

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: explainer/package-lock.json

      - name: Install Remotion system libraries + ffmpeg (Ubuntu 24.04)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 \
            libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 \
            libgbm-dev libcups2 libcairo2 libpango-1.0-0 libatk-bridge2.0-0 \
            ffmpeg

      - name: Install Edge-TTS
        run: python3 -m pip install --quiet --user edge-tts

      - name: Install node dependencies
        working-directory: explainer
        run: npm ci

      - name: Render tech explainer
        working-directory: longvideo
        env:
          LONGVIDEO_GEMINI_API_KEY: ${{ secrets.LONGVIDEO_GEMINI_API_KEY }}
          LONGVIDEO_GROQ_API_KEY: ${{ secrets.LONGVIDEO_GROQ_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          EXTRA=""
          if [ -n "${{ inputs.voice }}" ]; then EXTRA="--voice ${{ inputs.voice }}"; fi
          node make-tech-video.mjs --topic "${{ inputs.topic }}" --minutes ${{ inputs.minutes }} $EXTRA
          ntfyTopic="${NTFY_TOPIC:-}"
          if [ -n "$ntfyTopic" ]; then
            curl -s -H "Title: Tech video rendered" -d "Topic: ${{ inputs.topic }}" "https://ntfy.sh/$ntfyTopic" || true
          fi

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: tech-video
          path: explainer/out/tech-video.mp4
          retention-days: 14
          if-no-files-found: error
