# Weekly trending-topics mining: YouTube autocomplete per channel niche ->
# state/trend-topics.json (committed) + ntfy digest. Feed these into the topic
# bank / --topic inputs. Mondays 06:00 UTC (11 AM PKT).
name: Trending Topics

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  mine:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Mine YouTube autocomplete for the 4 niches
        working-directory: longvideo
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node trend-topics.mjs

      - name: Commit topic list
        run: |
          git config user.name "trends-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/trend-topics.json
          git commit -m "weekly trending topics [skip ci]" || true
          git push origin HEAD:main || (git pull --rebase -q origin main && git push origin HEAD:main) || true
